<!-- weekly/template.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pieces Team — Weekly Progress</title>
<style>/*__THEME__*/</style>
<style>
  /* Page layer. Every colour below is a token from shared/theme.css — no
     literals — so light and dark both follow the design system.

     dataviz rules encoded here:
     · The 4 workstreams are a KPI ROW of stat tiles (value + delta + sparkline),
       not a chart. One number each is the whole story.
     · Sparkline = de-emphasis gray for the trend, accent only on the current
       week. Status hues (--s-live / --s-merged / --s-review) are RESERVED for
       status and are never reused as a series colour.
     · Direction is never colour-alone: the delta pill carries a glyph and a
       sign as well as a hue (red↔green separate by only ΔE ~5 under protan /
       deutan, per scripts/validate_palette.js).
     · Big numbers use proportional figures; tabular-nums is only for columns. */
  body { background: var(--page); color: var(--text-primary); margin: 0;
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; }

  /* One control row, scoping the whole page — never a per-tile filter. */
  .nav { display: flex; gap: 6px; align-items: center; }
  .nav button, .nav select { background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; font: inherit; font-size: 13px; cursor: pointer; }
  .nav button { min-width: 32px; }
  .nav button[disabled] { opacity: .4; cursor: default; }
  .nav :focus-visible { outline: 2px solid var(--s-progress); outline-offset: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 22px 0; }
  @media (max-width: 640px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
          --spark-line: var(--text-muted); --spark-now: var(--bar-hue); }
  .tile h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--text-muted); margin: 0 0 10px; font-weight: 600; }
  /* Proportional figures on purpose — tabular-nums makes a display-size number look loose. */
  .big { font-size: 34px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: proportional-nums; }
  .unit { color: var(--text-secondary); font-size: 13px; margin-left: 6px; }
  .delta { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
           border: 1px solid var(--border); margin-left: 8px; vertical-align: 3px; white-space: nowrap; }
  .delta .arrow { font-size: 10px; }
  .delta.up { color: var(--good-text); } .delta.down { color: var(--sev-high); }
  .delta.flat { color: var(--text-muted); }
  .note { color: var(--text-secondary); font-size: 12.5px; margin-top: 10px; }
  /* Degraded state gets a non-colour cue too: a dashed edge and the word "No data". */
  .tile.is-nodata { border-style: dashed; }
  .nodata { color: var(--text-secondary); font-size: 13px; }
  .nodata b { color: var(--text-muted); font-weight: 600; }

  .trend { margin-top: 12px; }
  svg.spark { display: block; overflow: visible; }
  /* The sparkline is aria-hidden decoration; these are the same values as text. */
  .sparkcap { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .band { border: 1px solid var(--sev-high); border-radius: 10px; padding: 14px 18px; margin: 22px 0; }
  .band h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; color: var(--sev-high); }
  .band ul { margin: 0; padding-left: 18px; } .band li { margin: 3px 0; font-size: 13.5px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--text-muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); }
  /* tabular-nums belongs here: columns of numbers that must align vertically. */
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  section h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-muted); margin: 26px 0 0; font-weight: 600; }

  /* Per-piece rosters: the detail behind two of the tiles. Real
     <details>/<summary> — keyboard and screen-reader support for free. */
  details.roster { border-bottom: 1px solid var(--grid); }
  details.roster summary { cursor: pointer; padding: 8px 0; font-size: 13.5px; color: var(--text-secondary); }
  details.roster summary:focus-visible { outline: 2px solid var(--s-progress); outline-offset: 2px; }
  details.roster table { margin: 0 0 10px; }
  details.roster td { border-bottom: none; }
  footer { margin-top: 34px; font-size: 12.5px; color: var(--text-muted); }
  noscript { display: block; color: var(--text-secondary); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><div class="wrap">This page renders from an embedded snapshot; enable JavaScript, or read <code>summary.json</code> next to this file.</div></noscript>
<script>
const ARCHIVE = /*__DATA__*/null;
</script>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (v) => (typeof v === 'number' ? v.toLocaleString('en-US') : '—');

// Sparkline geometry. Padded so the 8px end-marker plus its 2px surface ring
// can never be clipped by the viewBox.
const SPARK = { w: 132, h: 34, padX: 5, padY: 6 };

function sparkSvg(points) {
  const vals = points.map((p) => p.value).filter((v) => typeof v === 'number');
  if (vals.length < 2) return '';
  const { w, h, padX, padY } = SPARK;
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const x0 = padX, x1 = w - padX, y0 = padY, y1 = h - padY;
  const step = (x1 - x0) / (points.length - 1);
  const xy = points.map((p, i) => [x0 + i * step, p.value === null ? null : y1 - ((p.value - min) / span) * (y1 - y0)]);
  let d = '', open = false;
  for (const [x, y] of xy) {
    if (y === null) { open = false; continue; }   // a no-data week breaks the line rather than bridging it
    d += `${open ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)} `;
    open = true;
  }
  const lastIdx = xy.reduce((acc, [, y], i) => (y === null ? acc : i), -1);
  const last = lastIdx === -1 ? null : xy[lastIdx];
  // A point whose neighbours are both missing would be a bare moveto and draw
  // nothing at all — a real value must never render as blank space.
  const dots = xy.map(([x, y], i) => {
    if (y === null || i === lastIdx) return '';
    const before = xy[i - 1], after = xy[i + 1];
    const isolated = (!before || before[1] === null) && (!after || after[1] === null);
    return isolated ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="var(--spark-line)"/>` : '';
  }).join('');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false">
    <path d="${d.trim()}" fill="none" stroke="var(--spark-line)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>${dots}
    ${last ? `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4"
          fill="var(--spark-now)" stroke="var(--surface-1)" stroke-width="2"/>` : ''}
  </svg>`;
}

// The chart is aria-hidden, so the same numbers ship as text: endpoints in the
// caption, every point in the hover title. Nothing is gated behind the tooltip.
function trendHtml(points) {
  const svg = sparkSvg(points);
  if (!svg) return '';
  const shown = points.filter((p) => typeof p.value === 'number');
  const first = shown[0], last = shown[shown.length - 1];
  const full = points.map((p) => `${p.week}: ${p.value === null ? 'no data' : p.value}`).join(' · ');
  return `<div class="trend" title="${esc(full)}">${svg}
    <div class="sparkcap">last ${points.length} weeks · ${num(first.value)} → ${num(last.value)}</div></div>`;
}

function deltaHtml(d) {
  // Direction is carried by the glyph and the sign, not by hue alone: red and
  // green are ~ΔE 5 apart under protan/deutan simulation.
  if (d === null || d === undefined) {
    return '<span class="delta flat">no prior week</span>';
  }
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  const glyph = d > 0 ? '▲' : d < 0 ? '▼' : '■';
  const sign = d > 0 ? '+' : '';
  return `<span class="delta ${cls}"><span class="arrow" aria-hidden="true">${glyph}</span> ${sign}${d} vs prior week</span>`;
}

function tileHtml(t) {
  if (t.status !== 'ok') {
    return `<div class="tile is-nodata"><h2>${esc(t.title)}</h2>
      <div class="nodata"><b>No data</b> — ${esc(t.reason)}</div></div>`;
  }
  return `<div class="tile"><h2>${esc(t.title)}</h2>
    <div><span class="big">${num(t.value)}</span><span class="unit">${esc(t.unit)}</span>${deltaHtml(t.delta)}</div>
    ${trendHtml(t.spark)}
    <div class="note">${esc(t.note)}</div></div>`;
}

// One collapsible group per stage. The first — the most advanced stage that
// actually has pieces — is open, so the section says something before a click.
// A roster the snapshot never recorded is simply absent from view.rosters, so
// nothing here renders an empty shell.
function rosterHtml(r) {
  return `<section><h2 class="sec">${esc(r.title)} — ${num(r.total)} in flight</h2>
    ${r.groups.map((g, i) => `<details class="roster"${i === 0 ? ' open' : ''}>
      <summary>${esc(g.label)} (${g.count})</summary>
      <table>${g.pieces.map((p) => `<tr><td>${esc(p.name)}</td>
        <td class="n">${num(p.actions)} ${esc(r.unit)}</td></tr>`).join('')}</table>
    </details>`).join('')}</section>`;
}

function render(view) {
  const app = document.getElementById('app');
  if (view.empty) {
    app.innerHTML = '<h1>Pieces Team — Weekly Progress</h1><p class="sub">No weeks recorded yet.</p>';
    return;
  }
  const idx = view.weeks.indexOf(view.week);
  const options = view.weeks.map((w) => `<option value="${w}"${w === view.week ? ' selected' : ''}>${w}</option>`).join('');
  app.innerHTML = `
    <header>
      <div><h1>Pieces Team — Weekly Progress</h1>
        <div class="sub">${esc(view.label)} · 7 days ending Friday · built ${esc(view.builtAt)}</div></div>
      <div class="nav">
        <button id="prev" ${idx === view.weeks.length - 1 ? 'disabled' : ''} aria-label="Previous week">←</button>
        <select id="pick" aria-label="Select week">${options}</select>
        <button id="next" ${idx === 0 ? 'disabled' : ''} aria-label="Next week">→</button>
      </div>
    </header>
    <div class="tiles">${view.tiles.map(tileHtml).join('')}</div>
    ${view.decisions.length ? `<div class="band"><h2>Needs a decision</h2><ul>${
      view.decisions.map((d) => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}
    ${view.people.length ? `<section><h2 class="sec">Per person</h2><table>
      <tr><th>Engineer</th><th class="n">Tickets</th><th class="n">PRs merged</th><th class="n">Reviews</th></tr>
      ${view.people.map((p) => `<tr><td>${esc(p.name)}</td><td class="n">${p.tickets}</td>
        <td class="n">${p.prsMerged}</td><td class="n">${p.reviews}</td></tr>`).join('')}
      </table></section>` : ''}
    ${(view.shipped.tickets.length || view.shipped.testing.length) ? `<section><h2 class="sec">Shipped this week</h2><table>
      ${view.shipped.tickets.map((i) => `<tr><td>${esc(i.id)}</td><td>${esc(i.title)}</td>
        <td>${esc(i.assignee ?? '')}</td></tr>`).join('')}
      ${view.shipped.testing.map((i) => `<tr><td>tester #${i.number}</td>
        <td><a href="${esc(i.url)}">${esc(i.title)}</a></td><td></td></tr>`).join('')}
      </table></section>` : ''}
    ${view.rosters.map(rosterHtml).join('')}
    <footer>Full detail: <a href="../output-schema/">outputSchema</a> ·
      <a href="../ai-actions/">AI-actions</a> · <a href="../">overview</a></footer>`;

  document.getElementById('pick').onchange = (e) => { location.hash = e.target.value; };
  document.getElementById('prev').onclick = () => { location.hash = view.weeks[idx + 1]; };
  document.getElementById('next').onclick = () => { location.hash = view.weeks[idx - 1]; };
}

// The view is precomputed server-side per week, so switching is a lookup.
// The final fallback matters: an empty archive has no default week, and
// `views[null]` is undefined — without it the page would throw instead of
// showing the placeholder.
const draw = () => {
  const active = document.activeElement && document.activeElement.id;
  render(ARCHIVE.views[location.hash.slice(1)] ?? ARCHIVE.views[ARCHIVE.default] ?? { empty: true, weeks: [] });
  // render() replaces the whole subtree, which would drop keyboard focus on
  // every week change; put it back where the user left it.
  const was = active && document.getElementById(active);
  if (was) {
    const target = was.disabled ? document.getElementById('pick') : was;
    if (target) target.focus();
  }
};
addEventListener('hashchange', draw);
draw();
</script>
</body>
</html>
