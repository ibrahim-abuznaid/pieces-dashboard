<!-- weekly/template.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pieces Team — Weekly Progress</title>
<style>/*__THEME__*/</style>
<style>
  /* Page layer. Every colour below is a token from shared/theme.css — no
     literals — so light and dark both follow the design system.

     dataviz rules encoded here:
     · The 4 workstreams are a KPI ROW of stat tiles (value + delta pill + the
       pieces behind the number), not a chart. One number each is the whole
       story, and there is no chart anywhere on this page: the trend sparkline
       and its caption were the two tallest blocks in a page whose acceptance
       criterion is fitting one laptop screen, and the delta pill already carries
       the only comparison this reader asked for.
     · Status hues (--s-live / --s-merged / --s-review) are RESERVED for status
       and are never reused for anything else here.
     · Direction is never colour-alone: the delta pill carries a glyph and a
       sign as well as a hue (red↔green separate by only ΔE ~5 under protan /
       deutan, per scripts/validate_palette.js).
     · Big numbers use proportional figures. tabular-nums is kept for the one
       small figure that must not jitter as the week changes, the date range;
       there are no columns of numbers on this page.
     · Vertical rhythm is a BUDGET, not a taste: see the one-screen test in
       test/weekly-render.test.mjs before loosening any margin below. */
  body { background: var(--page); color: var(--text-primary); margin: 0;
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  /* Padding, not decoration: 64px of dead space under the footer was a tenth of
     a 1366x768 viewport, and this page has to fit one. Nothing follows the
     footer, so the bottom is the cheapest 8px on the page — spent instead on
     room for a second "Needs you" line, which is content. */
  .wrap { max-width: 940px; margin: 0 auto; padding: 24px 20px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  /* The h1 is an eyebrow, not the headline: the headline of this page is the
     four numbers. Uppercasing in CSS rather than in the string keeps the text
     readable to screen readers and in summary.json. */
  h1 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase;
       letter-spacing: .08em; color: var(--text-secondary); }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 8px; }

  /* An archive with no weeks yet. The placeholder is the only thing on the page,
     so it is sized to be read rather than skimmed past. */
  .empty { font-size: 21px; line-height: 1.45; letter-spacing: -0.01em;
           margin: 14px 0 0; color: var(--text-primary); }

  /* One control row, scoping the whole page — never a per-tile filter. */
  .nav { display: flex; gap: 6px; align-items: center; }
  .nav .range { color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .nav button, .nav select { background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; font: inherit; font-size: 13px; cursor: pointer; }
  .nav button { min-width: 32px; }
  .nav button[disabled] { opacity: .4; cursor: default; }
  .nav :focus-visible { outline: 2px solid var(--s-progress); outline-offset: 2px; }

  /* `minmax(0, ...)` in BOTH tracks, and load-bearing in both: a bare `1fr` is
     `minmax(auto, 1fr)`, whose floor is min-content — and since a chip is nowrap
     (see the strip below) a tile's min-content width is its longest piece name.
     A one-column track left at `auto` grew to 566px inside a 335px container and
     pushed the boxes off the right edge of a 375px phone. Zeroing the floor lets
     the track take its container's width and the chip ellipsize inside it. */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
  @media (max-width: 640px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  .tile h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--text-muted); margin: 0 0 8px; font-weight: 600; }
  /* Proportional figures on purpose — tabular-nums makes a display-size number look loose. */
  .big { font-size: 34px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: proportional-nums; }
  .unit { color: var(--text-secondary); font-size: 13px; margin-left: 6px; }
  .delta { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
           border: 1px solid var(--border); margin-left: 8px; vertical-align: 3px; white-space: nowrap; }
  .delta .arrow { font-size: 10px; }
  .delta.up { color: var(--good-text); } .delta.down { color: var(--sev-high); }
  .delta.flat { color: var(--text-muted); }
  /* The per-person line in the tickets box — the only line of detail left under
     any number on this page. */
  .note { color: var(--text-secondary); font-size: 12.5px; margin-top: 8px; }
  /* Degraded state gets a non-colour cue too: a dashed edge and the word "No data". */
  .tile.is-nodata { border-style: dashed; }
  .nodata { color: var(--text-secondary); font-size: 13px; }
  .nodata b { color: var(--text-muted); font-weight: 600; }

  /* The pieces behind the number, in the same box as the number. `.chip` is the
     shared vocabulary from shared/theme.css; the pill shape, the colours (all
     theme tokens) and the wrapping are page-level.

     The strip WRAPS BETWEEN chips and never inside one, which is the page's last
     height bound. A chip that broke internally made a box as tall as its longest
     name: eight PR titles at 70 characters each drew seven one-chip rows and a
     336px box, and the page came to 796px against a 681px viewport (Chrome,
     1366x768). Two rules keep that from coming back:

     · `nowrap` — one line per chip, whatever the collector recorded.
     · `max-width: calc(50% - 3px)` — half a row less half the 5px gap, so TWO
       chips always fit on one row. With the cap at 5 a strip is 3 rows at worst,
       every box measures 202px and the same week comes to 662px. See the chip
       tests in test/weekly-render.test.mjs.

     What overflows is ellipsized, not truncated: the whole name stays in the
     markup, so selection and screen readers get it in full. The name needs an
     element of its own because a bare text node in a flex chip cannot be
     ellipsized, and `min-width: 0` because a flex item otherwise refuses to shrink
     below its text.

     That name is what the READER is shown — a piece's published name, a PR's
     subject without its commit prefix — resolved in the view, not here. The
     collectors' own strings stay verbatim in weekly/data/weeks.json, which is the
     record of what shipped. */
  .striplab { color: var(--text-muted); font-size: 11.5px; font-weight: 600;
              text-transform: uppercase; letter-spacing: .05em; margin-top: 10px; }
  ul.strip { list-style: none; display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0 0; padding: 0; }
  ul.strip .chip { display: inline-flex; align-items: center; gap: 6px; max-width: calc(50% - 3px);
                   color: var(--text-primary); font-size: 12px; white-space: nowrap;
                   background: var(--page); border: 1px solid var(--border);
                   border-radius: 999px; padding: 2px 9px 2px 3px; }
  ul.strip .chip .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  ul.strip .chip.more { color: var(--text-secondary); padding-left: 9px; }
  /* The initial sits UNDERNEATH the logo. A logo that 404s — or a page opened
     with no network at all — removes the img and reveals the letter, so a piece
     never degrades to a broken-image icon.

     Which makes the img layer's FILL load-bearing rather than cosmetic: piece
     logos are RGBA PNGs with transparent backgrounds, so an unfilled img lets the
     bold letter show through the artwork on the success path — the path the whole
     "recognise a piece by its logo" story rests on. The fill is the chip's own
     --page, so a logo still reads as sitting directly on the chip; the grey
     --grid square belongs to the fallback, where there is no logo to show. */
  .ic { position: relative; width: 16px; height: 16px; flex: none; }
  .ic img, .ic .init { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px; }
  .ic img { object-fit: contain; background: var(--page); }
  .ic .init { display: grid; place-items: center; background: var(--grid);
              color: var(--text-secondary); font-size: 10px; font-weight: 700; }

  /* Only asks land here, so the band can afford to look urgent. Bullets are
     replaced by an arrow marker: these are actions, not an inventory. */
  .band { border: 1px solid var(--sev-high); border-radius: 10px; padding: 10px 18px; margin: 16px 0; }
  .band h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; color: var(--sev-high); }
  .band ul { margin: 0; padding-left: 0; list-style: none; }
  .band li { margin: 3px 0; font-size: 13.5px; }
  .band .mark { color: var(--sev-high); font-weight: 600; }

  /* Nothing below the boxes but the links to the pages that hold the detail.
     There are no tables, sections or rosters on this page: everything a project
     manager needs is a number, its pieces, or an ask. */
  footer { margin-top: 14px; font-size: 12.5px; color: var(--text-muted); }
  noscript { display: block; color: var(--text-secondary); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><div class="wrap">This page renders from an embedded snapshot; enable JavaScript, or read <code>summary.json</code> next to this file.</div></noscript>
<script>
const ARCHIVE = /*__DATA__*/null;
</script>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (v) => (typeof v === 'number' ? v.toLocaleString('en-US') : '—');

function deltaHtml(d) {
  // Direction is carried by the glyph and the sign, not by hue alone: red and
  // green are ~ΔE 5 apart under protan/deutan simulation.
  // No delta, no badge: the caption says "no prior week" once for the page
  // instead of four pills repeating an absence on every tile.
  if (d === null || d === undefined) return '';
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  const glyph = d > 0 ? '▲' : d < 0 ? '▼' : '■';
  const sign = d > 0 ? '+' : '';
  return `<span class="delta ${cls}"><span class="arrow" aria-hidden="true">${glyph}</span> ${sign}${d} vs prior week</span>`;
}

// A piece's logo, with its first letter underneath. The letter is always in the
// DOM and the img is stacked on top of it, so `onerror` only has to REMOVE the
// image for the fallback to appear — no second request, nothing to load, and it
// works with the network entirely absent. A piece the catalog had no URL for
// renders the letter alone.
//
// The letter is emitted FIRST on purpose: paint order is DOM order, so the img
// covers it. That only hides it because `.ic img` is filled — piece logos are
// transparent PNGs; see the CSS.
//
// Decorative, every one of them: the piece's name is right there in the chip,
// so the icon is aria-hidden and the name is the accessible text.
const initial = (name) => esc(([...String(name)][0] ?? '·').toUpperCase());
const iconHtml = (p) => `<span class="ic" aria-hidden="true"><b class="init">${initial(p.name)}</b>${
  p.logo ? `<img src="${esc(p.logo)}" alt="" width="16" height="16" onerror="this.remove()">` : ''}</span>`;

// The pieces the number refers to, in the same box as the number. `label` is
// built in the view and is the honest part: "Done this week" only when there was
// a real preceding week to diff against, "Done in total" otherwise. A strip with
// a label and no chips is a week that moved nothing — that says itself.
function stripHtml(s) {
  if (!s) return '';
  // The name is its own element so the CSS can ellipsize it inside a chip that
  // is clamped to half a row — the whole string stays here either way.
  const chips = s.items.map((it) =>
    `<li class="chip">${s.kind === 'pieces' ? iconHtml(it) : ''}<span class="nm">${esc(it.name)}</span></li>`).join('');
  // Capped in the view: a big week must not push the page past one screen.
  const more = s.more ? `<li class="chip more">+${num(s.more)} more</li>` : '';
  return `<div class="striplab">${esc(s.label)}</div>${
    s.items.length ? `<ul class="strip">${chips}${more}</ul>` : ''}`;
}

// A box is a number, its unit, and the pieces behind it. `perPerson` is the one
// line of detail any box carries — who closed the tickets — and it is empty on
// the other three. A degraded tile keeps the em dash in the number slot so the
// KPI row still scans as a row of four, and carries no strip: only its reason.
function tileHtml(t) {
  if (t.status !== 'ok') {
    return `<div class="tile is-nodata"><h2>${esc(t.title)}</h2>
      <div><span class="big">—</span></div>
      <div class="nodata"><b>No data</b> — ${esc(t.reason)}</div></div>`;
  }
  return `<div class="tile"><h2>${esc(t.title)}</h2>
    <div><span class="big">${num(t.value)}</span><span class="unit">${esc(t.unit)}</span>${deltaHtml(t.delta)}</div>
    ${t.perPerson ? `<div class="note">${esc(t.perPerson)}</div>` : ''}
    ${stripHtml(t.strip)}</div>`;
}

function render(view) {
  const app = document.getElementById('app');
  if (view.empty) {
    app.innerHTML = '<h1>Pieces Team · Weekly progress</h1><p class="empty">No weeks recorded yet.</p>';
    return;
  }
  const idx = view.weeks.indexOf(view.week);
  const options = view.weeks.map((w) => `<option value="${w}"${w === view.week ? ' selected' : ''}>${w}</option>`).join('');
  // How fresh the page is, and — when it applies — why no box carries a delta.
  // The date range beside the week already says which 7 days these are, so the
  // window definition is not spelled out.
  const caption = `built ${esc(view.builtAt)}`
    + (view.noPriorWeek ? ' · no prior week to compare against yet' : '');
  app.innerHTML = `
    <header>
      <h1>${esc(view.title)}</h1>
      <div class="nav">
        <button id="prev" ${idx === view.weeks.length - 1 ? 'disabled' : ''} aria-label="Previous week">←</button>
        <span class="range">${esc(view.range)}</span>
        <select id="pick" aria-label="Select week">${options}</select>
        <button id="next" ${idx === 0 ? 'disabled' : ''} aria-label="Next week">→</button>
      </div>
    </header>
    <div class="sub">${caption}</div>
    <div class="tiles">${view.tiles.map(tileHtml).join('')}</div>
    ${view.decisions.length ? `<div class="band"><h2>Needs you</h2><ul>${
      view.decisions.map((d) => `<li><span class="mark" aria-hidden="true">→</span> ${esc(d)}</li>`).join('')}</ul></div>` : ''}
    <footer>Full detail: <a href="../output-schema/">outputSchema</a> ·
      <a href="../ai-actions/">AI-actions</a> · <a href="../">overview</a></footer>`;

  document.getElementById('pick').onchange = (e) => { location.hash = e.target.value; };
  document.getElementById('prev').onclick = () => { location.hash = view.weeks[idx + 1]; };
  document.getElementById('next').onclick = () => { location.hash = view.weeks[idx - 1]; };
}

// The view is precomputed server-side per week, so switching is a lookup.
// The final fallback matters: an empty archive has no default week, and
// `views[null]` is undefined — without it the page would throw instead of
// showing the placeholder.
const draw = () => {
  const active = document.activeElement && document.activeElement.id;
  render(ARCHIVE.views[location.hash.slice(1)] ?? ARCHIVE.views[ARCHIVE.default] ?? { empty: true, weeks: [] });
  // render() replaces the whole subtree, which would drop keyboard focus on
  // every week change; put it back where the user left it.
  const was = active && document.getElementById(active);
  if (was) {
    const target = was.disabled ? document.getElementById('pick') : was;
    if (target) target.focus();
  }
};
addEventListener('hashchange', draw);
draw();
</script>
</body>
</html>
